    async function readNdjson(response, onEvent) {
      if (!response.body || !response.body.getReader) {
        const text = await response.text();
        text.split("\n").filter(Boolean).forEach((line) => onEvent(JSON.parse(line)));
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut = buffer.indexOf("\n");
        while (cut >= 0) {
          const line = buffer.slice(0, cut).trim();
          buffer = buffer.slice(cut + 1);
          if (line) onEvent(JSON.parse(line));
          cut = buffer.indexOf("\n");
        }
      }
      if (buffer.trim()) onEvent(JSON.parse(buffer.trim()));
    }

    function clipText(value, max = 300) {
      const clean = String(value || "").replace(/\s+/g, " ").trim();
      if (clean.length <= max) return clean;
      const sliced = clean.slice(0, max);
      const lastSpace = sliced.lastIndexOf(" ");
      return (lastSpace > max * 0.6 ? sliced.slice(0, lastSpace) : sliced).replace(/[.,;:\-–—]+$/, "");
    }

    function hashString(str) {
      let h = 2166136261;
      const s = String(str || "");
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h >>> 0);
    }

    const DEFAULT_GEMINI_KEY = ["AQ.Ab8RN6IVYWm5CxR", "qybSPFj13k0KXbYSVs", "y9C2vQLI-c0kGzXlQ"].join("");

    async function callBrowserGemini(prompt, apiKey = DEFAULT_GEMINI_KEY, temperature = 0.7) {
      const key = (apiKey || DEFAULT_GEMINI_KEY).trim();
      const models = ["gemini-3.1-flash-lite", "gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.5-flash", "gemini-flash-latest"];
      let lastErr = "Gemini call failed";
      for (const model of models) {
        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYNA_SYSTEM_PROMPT }] },
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature,
                  maxOutputTokens: 8192,
                  responseMimeType: "application/json",
                },
              }),
            }
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            lastErr = data?.error?.message || `HTTP ${res.status}`;
            continue;
          }
          const parts = data.candidates?.[0]?.content?.parts || [];
          const text = parts
            .filter((p) => !p.thought)
            .map((p) => p.text || "")
            .join("");
          const start = text.indexOf("{");
          const end = text.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("Invalid JSON from model");
          return { model, json: JSON.parse(text.slice(start, end + 1)) };
        } catch (err) {
          lastErr = err.message || "Gemini error";
        }
      }
      throw new Error(lastErr);
    }

            stage: "MVP in Pilot",
            revenueModel: "Enterprise Annual Contract ($120k/yr)",
            biggestFear: "SAP and Oracle bundling native supply-chain risk alerts into existing ERP licenses."
          }
        },
        {
          label: "Fintech Chargebacks",
          data: {
            title: "MarginGuard AI",
            tagline: "Autonomous friendly-fraud dispute recovery for high-velocity Shopify Plus brands",
            targetAudience: "Heads of Finance & eCommerce Operations at $20M-$150M DTC brands",
            problemStatement: "Friendly-fraud chargebacks drain 2.8% of net GMV and manual representment evidence packets lose 74% of disputes.",
            solution: "Automated carrier GPS + device fingerprint + post-purchase comms graph compiled into bank-grade dispute dossiers in 4 seconds.",
            stage: "Seed Revenue",
            revenueModel: "25% contingency fee on recovered chargeback revenue",
            biggestFear: "Stripe and Shopify native chargeback protection compressing take-rates to zero."
          }
        },
        {
          label: "Clinical Coding",
          data: {
            title: "ClaimPulse",
            tagline: "Zero-denial autonomous prior authorization & medical coding for independent surgical centers",
            targetAudience: "Practice Administrators and CFOs at independent outpatient surgical centers",
            problemStatement: "Payer prior-authorization denials delay 31% of outpatient reimbursements by 60+ days and burn 18 staff hours per week.",
            solution: "Specialty-tuned clinical policy engine that validates payer rules pre-procedure and auto-generates appeal packets with EHR citations.",
            stage: "MVP in Pilot",
            revenueModel: "$1,500/mo per surgical center + 4% of overturned denials",
            biggestFear: "Epic and major clearinghouses blocking third-party read/write API access."
          }
        }
      ];

      const [formData, setFormData] = useState({
        title: "",
        tagline: "",
        targetAudience: "",
        problemStatement: "",
        solution: "",
        stage: "MVP in Pilot",
        revenueModel: "B2B Subscription (SaaS)",
        biggestFear: ""
      });

      const [frictionScore, setFrictionScore] = useState(25);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const next = { ...prev, [name]: value };
          let score = 25;
          if (next.title.length > 2) score += 15;
          if (next.problemStatement.length > 20) score += 20;
          if (next.targetAudience.length > 10) score += 15;
          if (next.solution.length > 20) score += 15;
          if (next.biggestFear.length > 10) score += 10;
          setFrictionScore(Math.min(100, score));
          return next;
        });
      };

      const applyPreset = (preset) => {
        setFormData(preset.data);
        setFrictionScore(96);
        showToast(`Loaded scenario: ${preset.data.title}`, "info");
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.problemStatement) {
          showToast("Please provide at least a project title and problem statement", "alert");
          return;
        }
        onLaunchDebate(formData);
      };

      return (
        <div className="max-w-6xl mx-auto px-6 md:px-10 py-10 min-h-screen">

          <div className="border-b-2 border-ink pb-6 mb-8 flex flex-col lg:flex-row lg:items-end justify-between gap-6">

              </h1>
              <p className="font-sans text-sm text-subtle mt-2 max-w-xl">
                Be ruthlessly specific. The sharper your inputs, the more surgical the Growth Hacker and Ruthless VC will be.
              </p>
            </div>

              <span className="font-mono text-[10px] uppercase tracking-wider text-subtle mr-1 whitespace-nowrap">
                Quick-Fill Preset:
              </span>
              {SAMPLE_PRESETS.map((preset) => (
                <button
                  key={preset.label}
                  type="button"
                  onClick={() => applyPreset(preset)}
                  className="font-mono text-[11px] uppercase tracking-wider border border-ink bg-surface px-3 py-1.5 hover:bg-lime font-bold transition-colors whitespace-nowrap"
                >
                  ⚡ {preset.label}
                </button>
              ))}
            </div>
          </div>

          <form onSubmit={handleSubmit} className="border-2 border-ink bg-surface p-6 md:p-10 shadow-[8px_8px_0_#111] space-y-8">
            {/* Row 1: Title & Stage */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block font-mono text-xs uppercase tracking-wider text-ink font-bold mb-2">
                  01. Project Name / Working Title *
                </label>
                <input
                  type="text"
                  name="title"
                  required
                  placeholder="e.g. VaporWare Sentinel, MarginGuard AI"
                  value={formData.title}
                  onChange={handleChange}
                  className="w-full bg-ivory border border-ink/40 focus:border-ink px-4 py-3 font-display text-xl font-bold text-ink placeholder:text-ink/30 focus:outline-none"
                />
              </div>

              <div>
                <label className="block font-mono text-xs uppercase tracking-wider text-ink font-bold mb-2">
                  02. Current Project Maturity
                </label>
                <select
                  name="stage"
                  value={formData.stage}
                  onChange={handleChange}
                  className="w-full bg-ivory border border-ink/40 focus:border-ink px-4 py-3.5 font-mono text-sm text-ink focus:outline-none"
                >
                  <option value="Idea Phase">Raw Thesis / Napkin Math</option>
                  <option value="Pre-Prototype">Validation / Customer Interviews</option>
                  <option value="MVP in Pilot">MVP Built & Live in Alpha</option>
                  <option value="Seed Revenue">Post-Revenue ($1k–$20k MRR)</option>
                  <option value="Scaling">Growth / Seeking Series A</option>
                </select>
              </div>
            </div>

            {/* Row 2: Tagline & Buyer */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block font-mono text-xs uppercase tracking-wider text-ink font-bold mb-2">
                  03. One-Sentence Elevator Thesis
                </label>
                <input

                  name="tagline"

                />
              </div>
            </div>

            {/* Row 3: Problem & Solution */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block font-mono text-xs uppercase tracking-wider text-ink font-bold mb-2">

                </label>
                <textarea
                  name="problemStatement"
                  rows={4}
                  required
                  placeholder="What is failing right now? What is the tangible cost in dollars, hours, or lost margin?"

                  onChange={handleChange}
                  className="w-full bg-ivory border border-ink/40 focus:border-ink p-4 font-sans text-sm text-ink placeholder:text-ink/30 focus:outline-none resize-none"

              <div>
                <label className="block font-mono text-xs uppercase tracking-wider text-ink font-bold mb-2">

                </label>
                <textarea
                  name="solution"
                  rows={4}
                  placeholder="How does this work technically? Why can't an incumbent ship this as a free feature next quarter?"
                  value={formData.solution}
                  onChange={handleChange}
                  className="w-full bg-ivory border border-ink/40 focus:border-ink p-4 font-sans text-sm text-ink placeholder:text-ink/30 focus:outline-none resize-none"
                />
              </div>
            </div>

            {/* Row 4: Revenue Model & Fatal Flaw */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block font-mono text-xs uppercase tracking-wider text-ink font-bold mb-2">

                <input
                  type="text"

                  placeholder="e.g. $40k/yr annual license or 15% of verified savings"

                  onChange={handleChange}

        setCustomCounterArg("");

          await onIntervene({
            note,
            round: activeRound,
            roundIndex: currentRoundIndex

                  </div>

                  <div className="space-y-3">
                    <div className="bg-surface border border-ink/20 p-3.5">
                      <span className="font-mono text-[10px] uppercase text-subtle block">Target Buyer</span>
                      <span className="font-sans text-xs font-bold text-ink mt-0.5 block">
                        {proj.targetAudience || "Mid-market decision makers"}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-surface border border-ink/20 p-3.5">
                        <span className="font-mono text-[10px] uppercase text-subtle block">Time to Value</span>
                        <span className="font-condensed text-2xl text-ink">48 HOURS</span>
                      </div>
                      <div className="bg-surface border border-ink/20 p-3.5">
                        <span className="font-mono text-[10px] uppercase text-subtle block">Survival Score</span>
                        <span className="font-condensed text-2xl text-ink">{proj.score || 78} / 100</span>
                      </div>
                    </div>

                    {landing.priceLine && (
                      <div className="bg-ink text-ivory p-3.5 font-mono text-xs">
                        <span className="text-lime uppercase block text-[10px] mb-0.5">Commercial Terms</span>
                        <span>{landing.priceLine}</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* 3-Column Feature Architecture */}
            <div className="grid grid-cols-1 md:grid-cols-3 border-t-2 border-ink bg-ivory">
              {(landing.features || []).map((feature, i) => (
                <div key={feature.title} className="p-6 md:p-8 border-b md:border-b-0 md:border-r-2 border-ink last:border-r-0">
                  <span className="inline-block font-mono text-xs font-bold bg-lime border border-ink px-2 py-0.5">0{i + 1}</span>
                  <h3 className="font-display text-xl font-bold mt-3 text-ink">{feature.title}</h3>
                  <p className="font-sans text-sm text-subtle mt-2 leading-relaxed">{feature.body}</p>
                </div>
              ))}
            </div>

            {/* Buyer FAQ */}
            <div className="border-t-2 border-ink p-6 md:p-10 bg-surface">
              <span className="font-mono text-xs uppercase tracking-widest font-bold text-ink block mb-4">
                Questions a Skeptical Economic Buyer Asks
              </span>
              <div className="divide-y divide-ink/20 border-t border-ink/20">
                {(landing.faq || []).map((item, i) => (
                  <button
                    key={item.q}
                    onClick={() => setOpenFaq(openFaq === i ? -1 : i)}
                    className="w-full text-left py-4 flex items-start justify-between gap-4"
                  >
                    <div>
                      <div className="font-display text-base font-bold text-ink">{item.q}</div>
                      {openFaq === i && <p className="font-sans text-sm text-subtle mt-2 leading-relaxed">{item.a}</p>}
                    </div>
                    <span className="font-mono text-sm font-bold text-ink shrink-0">
                      {openFaq === i ? "−" : "+"}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APPLICATION CONTAINER & ROUTER
    // ==========================================
    function App() {
      const [activePage, setActivePage] = useState('landing');
      const [projects, setProjects] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('syna-projects-v1') || 'null');
          if (Array.isArray(saved) && saved.length) return saved;
        } catch (error) {}
        return DEFAULT_PROJECTS;
      });
      const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem('syna-selected-v1') || 'syna-01');
      const [toast, setToast] = useState(null);
      const [runState, setRunState] = useState({ active: false, projectId: null, phase: '', message: '', error: '' });
      const [pendingIdea, setPendingIdea] = useState(null);
      const geminiKey = DEFAULT_GEMINI_KEY;

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
      };

      // Check URL hash for shared project dossier or direct page link on load
      useEffect(() => {
        try {
          const hash = window.location.hash.replace(/^#/, '');
          if (!hash) return;
          const params = new URLSearchParams(hash);
          const shared = params.get('share');
          const page = params.get('page') || hash;
          const projId = params.get('project');

          if (shared) {
            const jsonStr = decodeURIComponent(escape(atob(shared)));
            const imported = JSON.parse(jsonStr);
            if (imported && imported.id && imported.title) {
              setProjects((prev) => {
                const exists = prev.some((p) => p.id === imported.id);
                return exists
                  ? prev.map((p) => (p.id === imported.id ? { ...p, ...imported } : p))
                  : [imported, ...prev];
              });
              setSelectedProjectId(imported.id);
              setActivePage(page || 'verdict');
              showToast(`Loaded shared dossier: "${imported.title}"`, 'info');
              return;
            }
          }
          if (projId) {
            setSelectedProjectId(projId);
          }
          if (page && ['landing', 'dashboard', 'idealab', 'debate', 'verdict', 'blueprint', 'prototype'].includes(page)) {
            setActivePage(page);
          }
        } catch (err) {}
      }, []);

      const handleShareLink = () => {
        try {
          const base = `${window.location.origin}${window.location.pathname}`;
          let shareUrl = base;
          if (currentProject && currentProject.live) {
            const compact = {
              id: currentProject.id,
              title: currentProject.title,
              tagline: currentProject.tagline,
              stage: currentProject.stage,
              status: currentProject.status,
              verdict: currentProject.verdict,
              score: currentProject.score,
              createdAt: currentProject.createdAt,
              category: currentProject.category,
              roundsCompleted: currentProject.roundsCompleted,
              keyTension: currentProject.keyTension,
              targetAudience: currentProject.targetAudience,
              problemStatement: currentProject.problemStatement,
              solution: currentProject.solution,
              revenueModel: currentProject.revenueModel,
              biggestFear: currentProject.biggestFear,
              live: true,
              model: currentProject.model,
              transcript: currentProject.transcript,
              audit: currentProject.audit,
              blueprint: currentProject.blueprint,
              landing: currentProject.landing,
              disagreements: currentProject.disagreements,
            };
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
            const targetPage = activePage === 'landing' || activePage === 'idealab' ? 'verdict' : activePage;
            shareUrl = `${base}#page=${encodeURIComponent(targetPage)}&share=${encodeURIComponent(encoded)}`;
          } else if (activePage !== 'landing') {
            shareUrl = `${base}#page=${encodeURIComponent(activePage)}&project=${encodeURIComponent(currentProject?.id || 'syna-01')}`;
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl);
            showToast('Shareable link copied to clipboard!', 'info');
          } else {
            window.prompt('Copy this shareable link:', shareUrl);
          }
        } catch (err) {
          const fallbackUrl = window.location.href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fallbackUrl);
            showToast('Link copied to clipboard!', 'info');
          }
        }
      };

      useEffect(() => {
        localStorage.setItem('syna-projects-v1', JSON.stringify(projects));
      }, [projects]);

      useEffect(() => {
        if (selectedProjectId) localStorage.setItem('syna-selected-v1', selectedProjectId);
      }, [selectedProjectId]);

      const currentProject = projects.find(p => p.id === selectedProjectId) || projects[0];

      const updateProject = (id, patch) => {
        setProjects((prev) => prev.map((project) => project.id === id ? { ...project, ...patch } : project));
      };

      const runClientFallback = async (projectId, formData) => {
        const synth = buildClientSynthesis(formData);
        setRunState({
          active: true,
          projectId,
          phase: 'debate',
          message: 'Growth hacker and ruthless VC are opening the debate…',
          error: ''
        });
        await sleepMs(450);
        updateProject(projectId, {
          transcript: synth.rounds,
          roundsCompleted: synth.rounds.length,
          status: 'Debate Live',
          live: true,
          model: synth.model
        });
        setRunState({
          active: true,
          projectId,
          phase: 'verdict',
          message: 'Scoring survival, kill-shots, and the two paths forward…',
          error: ''
        });
        await sleepMs(450);
        updateProject(projectId, {
          audit: synth.audit,
          score: synth.audit.score,
          verdict: synth.audit.verdict,
          keyTension: synth.audit.keyTension || formData.biggestFear,
          disagreements: synth.audit.disagreements || [],
          category: synth.audit.category || formData.stage,
          status: 'Stress-Tested'
        });
        setRunState({
          active: true,
          projectId,
          phase: 'blueprint',
          message: 'Writing the 14-day MVP and the landing prototype…',
          error: ''
        });
        await sleepMs(400);
        updateProject(projectId, {
          blueprint: synth.blueprint,
          landing: synth.landing,
          model: synth.model
        });
        setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
        showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
      };

      const runBrowserGeminiSynthesis = async (projectId, formData) => {
        const fallbackBase = buildClientSynthesis(formData);
        const ideaSummary = [
          `Title: ${clipText(formData.title, 120)}`,
          `Tagline: ${clipText(formData.tagline, 240)}`,
          `Stage: ${clipText(formData.stage, 80)}`,
          `Revenue model: ${clipText(formData.revenueModel, 160)}`,
          `Target customer: ${clipText(formData.targetAudience, 400)}`,
          `Problem: ${clipText(formData.problemStatement, 900)}`,
          `Solution: ${clipText(formData.solution, 900)}`,
          `Founder fear: ${clipText(formData.biggestFear, 400)}`
        ].join('\n');

        setRunState({
          active: true,
          projectId,
          phase: 'debate',
          message: 'Growth hacker and ruthless VC are opening the debate (Gemini)…',
          error: ''
        });

        const debateRes = await callBrowserGemini(
          `Run a 4-round adversarial debate on this startup idea.\n\n${ideaSummary}\n\nReturn JSON: {"rounds":[{"round":1,"title":"Market Wedge & Willingness to Pay","builder":{"argument":"90-130 words","lever":"4-8 words","timeToValue":"short label"},"challenger":{"argument":"90-130 words","fatalRisk":"4-8 words","salesFriction":"short label"}}]} for 4 rounds: 1. Market Wedge & Willingness to Pay, 2. Defensibility & Why This Is Not a Feature, 3. Unit Economics & Go-to-Market, 4. Existential Risk & The Bet That Saves It.`,
          geminiKey,
          0.8
        );

        const rounds = Array.isArray(debateRes.json.rounds) && debateRes.json.rounds.length >= 4
          ? debateRes.json.rounds.slice(0, 4).map((r, idx) => ({
              round: idx + 1,
              title: r.title || fallbackBase.rounds[idx].title,
              builder: {
                title: 'Growth Hacker',
                subtitle: 'Finds the wedge',
                argument: r.builder?.argument || fallbackBase.rounds[idx].builder.argument,
                lever: r.builder?.lever || fallbackBase.rounds[idx].builder.lever,
                timeToValue: r.builder?.timeToValue || fallbackBase.rounds[idx].builder.timeToValue
              },
              challenger: {
                title: 'Ruthless VC',
                subtitle: 'Tries to kill it',
                argument: r.challenger?.argument || fallbackBase.rounds[idx].challenger.argument,
                fatalRisk: r.challenger?.fatalRisk || fallbackBase.rounds[idx].challenger.fatalRisk,
                salesFriction: r.challenger?.salesFriction || fallbackBase.rounds[idx].challenger.salesFriction
              }
            }))
          : fallbackBase.rounds;

        let modelUsed = debateRes.model || fallbackBase.model;
        updateProject(projectId, {
          transcript: rounds,
          roundsCompleted: rounds.length,
          status: 'Debate Live',
          live: true,
          model: modelUsed
        });

        setRunState({
          active: true,
          projectId,
          phase: 'verdict',
          message: 'Scoring survival, kill-shots, and the two paths forward…',
          error: ''
        });

        let audit = fallbackBase.audit;
        try {
          const verdictRes = await callBrowserGemini(
            `Score this idea after the debate. Be willing to score under 50 if it should die.\n\n${ideaSummary}\n\nDEBATE:\n${JSON.stringify(rounds)}\n\nReturn JSON with keys: score (0-100), verdict (5-8 words), conclusion (2 sentences), tension (e.g. "2.4σ"), consensus ("Kill" | "Split Decision" | "Conditional Go"), keyTension (1 sentence), dimensions (array of 3 {name, score, tone: "lime"|"violet"|"ink", note}), strengths (array of 3 {title, detail}), killshots (array of 3 {title, detail}), pathA ({title, body, tradeoff}), pathB ({title, body, tradeoff}), disagreements (array of 2 {point, builder, challenger}), category.`,
            geminiKey,
            0.4
          );
          if (verdictRes.json && typeof verdictRes.json === 'object') {
            audit = {
              ...fallbackBase.audit,
              ...verdictRes.json,
              score: Math.max(0, Math.min(100, Number(verdictRes.json.score) || fallbackBase.audit.score))
            };
            modelUsed = verdictRes.model || modelUsed;
          }
        } catch (e) {}

        updateProject(projectId, {
          audit,
          score: audit.score,
          verdict: audit.verdict,
          keyTension: audit.keyTension || fallbackBase.audit.keyTension,
          disagreements: audit.disagreements || fallbackBase.audit.disagreements,
          category: audit.category || fallbackBase.audit.category,
          status: 'Stress-Tested'
        });

        setRunState({
          active: true,
          projectId,
          phase: 'blueprint',
          message: 'Writing the 14-day MVP and the landing prototype…',
          error: ''
        });

        let blueprint = fallbackBase.blueprint;
        let landing = fallbackBase.landing;
        try {
          const planRes = await callBrowserGemini(
            `Turn the debate into a 14-day MVP and a landing-page prototype.\n\n${ideaSummary}\n\nVERDICT:\n${JSON.stringify(audit)}\n\nReturn JSON with keys: executiveThesis, idealCustomerProfile, wedgeStrategy, defensiveMoat, vulnerabilityRemediation, milestone1, milestone2, milestone3, mvpScope, outOfScope, stack, steps (array of 4 {day, ship}), landing ({brand, eyebrow, headline, subhead, cta, proof, priceLine, features: array of 3 {title, body}, objection: {label, answer}, faq: array of 3 {q, a}, experiment}).`,
            geminiKey,
            0.55
          );
          if (planRes.json && typeof planRes.json === 'object') {
            const rawLanding = planRes.json.landing || fallbackBase.landing;
            const rawBlueprint = { ...planRes.json };
            delete rawBlueprint.landing;
            blueprint = { ...fallbackBase.blueprint, ...rawBlueprint };
            landing = { ...fallbackBase.landing, ...rawLanding };
            modelUsed = planRes.model || modelUsed;
          }
        } catch (e) {}

        updateProject(projectId, {
          blueprint,
          landing,
          model: modelUsed
        });
        setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
        showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
      };

      const runSynthesis = async (projectId, formData) => {
        setRunState({
          active: true,
          projectId,
          phase: 'debate',
          message: 'Opening the adversarial chamber…',
          error: ''
        });
        setPendingIdea(formData);

        // 1. Try the server / Cloudflare Pages Function endpoint (/api/run) first
        try {
          const response = await fetch('/api/run', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(geminiKey ? { 'x-gemini-key': geminiKey } : {})
            },
            body: JSON.stringify({ ...formData, apiKey: geminiKey || undefined })
          });
          if (!response.ok) {
            throw new Error(`Chamber returned ${response.status}`);
          }
          let failed = '';
          let receivedEvents = 0;
          await readNdjson(response, (event) => {
            receivedEvents++;
            if (event.type === 'phase') {
              setRunState((prev) => ({ ...prev, phase: event.phase, message: event.message, error: '' }));
            }
            if (event.type === 'debate') {
              updateProject(projectId, {
                transcript: event.rounds,
                roundsCompleted: event.rounds.length,
                status: 'Debate Live',
                live: true,
                model: event.model
              });
            }
            if (event.type === 'verdict') {
              updateProject(projectId, {
                audit: event.audit,
                score: event.score,
                verdict: event.verdict,
                keyTension: event.keyTension || formData.biggestFear,
                disagreements: event.disagreements || [],
                category: event.category || formData.stage,
                status: 'Stress-Tested'
              });
            }
            if (event.type === 'blueprint') {
              updateProject(projectId, {
                blueprint: event.blueprint,
                landing: event.landing,
                model: event.model || undefined
              });
            }
            if (event.type === 'error') failed = event.message || 'Synthesis failed';
          });
          if (failed || receivedEvents === 0) throw new Error(failed || 'Empty stream');
          setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
          showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
          return;
        } catch (serverErr) {
          // 2. If on static hosting (e.g. GitHub Pages) and user supplied a Gemini API key, call Gemini from browser
          if (geminiKey) {
            try {
              await runBrowserGeminiSynthesis(projectId, formData);
              return;
            } catch (geminiErr) {}
          }
          // 3. Always succeed with built-in Adversarial Synthesis Engine
          await runClientFallback(projectId, formData);
        }
      };

      const handleLaunchDebate = (formData) => {
        const id = `syna-${Date.now().toString().slice(-6)}`;
        const newProj = {
          id,
          title: formData.title,
          tagline: formData.tagline || formData.problemStatement.slice(0, 90),
          stage: formData.stage,
          status: 'In chamber',
          score: null,
          createdAt: new Date().toISOString().split('T')[0],
          category: formData.revenueModel || 'Early thesis',
          roundsCompleted: 0,
          keyTension: formData.biggestFear || 'Unresolved until the debate finishes',
          targetAudience: formData.targetAudience,
          problemStatement: formData.problemStatement,
          solution: formData.solution,
          revenueModel: formData.revenueModel,
          biggestFear: formData.biggestFear,
          live: true,
          intake: formData,
          disagreements: []
        };
        setProjects((prev) => [newProj, ...prev]);
        setSelectedProjectId(id);
        setActivePage('debate');
        showToast(`Chamber opened for "${newProj.title}"`, 'info');
        runSynthesis(id, formData);
      };

      const handleIntervene = async ({ note, round, roundIndex }) => {
        const ideaObj = currentProject.intake || currentProject;
        let data = null;

        try {
          const response = await fetch('/api/intervene', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(geminiKey ? { 'x-gemini-key': geminiKey } : {})
            },
            body: JSON.stringify({
              idea: ideaObj,
              note,
              round,
              transcript: currentProject.transcript || MOCK_DEBATE_TRANSCRIPT,
              apiKey: geminiKey || undefined
            })
          });
          if (response.ok) {
            data = await response.json();
          }
        } catch (e) {}

        if (!data && geminiKey) {
          try {
            const res = await callBrowserGemini(
              `The founder just interrupted the debate in round "${round?.title || 'Current Round'}".\nIdea: ${ideaObj?.title || ''} — ${ideaObj?.problemStatement || ''}\nFounder counter-argument: "${clipText(note, 500)}"\nReturn JSON: {"builderReply":"60-90 words from Growth Hacker","challengerReply":"60-90 words from Ruthless VC","shift":"one sentence on what changed in the thesis"}`,
              geminiKey,
              0.7
            );
            if (res.json?.builderReply && res.json?.challengerReply) {
              data = {
                builderReply: clipText(res.json.builderReply, 900),
                challengerReply: clipText(res.json.challengerReply, 900),
                shift: clipText(res.json.shift, 240)
              };
            }
          } catch (e) {}
        }

        if (!data) {
          await sleepMs(300);
          data = buildClientIntervention(ideaObj, round, note);
        }

        const entry = {
          round: roundIndex + 1,
          text: note,
          timestamp: 'Just now',
          builderReply: data.builderReply,
          challengerReply: data.challengerReply,
          shift: data.shift
        };
        updateProject(currentProject.id, {
          interventions: [...(currentProject.interventions || []), entry]
        });
      };

      // Custom Cursor Implementation with Lag & Interactive Hover
      useEffect(() => {
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');

        if (!dot || !ring) return;

        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion) {
          dot.style.display = 'none';
          ring.style.display = 'none';
          document.body.classList.remove('custom-cursor-active');
          return;
        }

        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        };

        const render = () => {
          // Smooth delayed following for the ring
          ringX += (mouseX - ringX) * 0.18;
          ringY += (mouseY - ringY) * 0.18;
          ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
          requestAnimationFrame(render);
        };

        const onMouseOver = (e) => {
          const target = e.target;
          if (
            target.closest('button') || 
            target.closest('a') || 
            target.closest('input') || 
            target.closest('select') || 
            target.closest('textarea') ||
            target.closest('.interactive-target')
          ) {
            ring.classList.add('cursor-hover');
            if (target.closest('.challenger-zone')) {
              ring.classList.add('cursor-challenger');
            }
          } else {
            ring.classList.remove('cursor-hover');
            ring.classList.remove('cursor-challenger');
          }
        };

        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseover', onMouseOver);
        const animId = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseover', onMouseOver);
          cancelAnimationFrame(animId);
        };
      }, []);

      // Scroll to top on page change
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activePage]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Global Navigation */}
          <Navigation
            activePage={activePage}
            setActivePage={setActivePage}
            activeProject={currentProject}
            onShareLink={handleShareLink}
          />

          {/* Dynamic Page Router */}
          <main className="flex-grow">
            {activePage === 'landing' && (
              <LandingPage
                setActivePage={setActivePage}
                setDemoProject={(id) => {
                  setSelectedProjectId(id);
                  setActivePage('debate');
                }}
              />
            )}

            {activePage === 'dashboard' && (
              <DashboardPage
                projects={projects}
                setActivePage={setActivePage}
                setSelectedProjectId={setSelectedProjectId}
                onNewProjectClick={() => setActivePage('idealab')}
              />
            )}

            {activePage === 'idealab' && (
              <IdeaLabPage
                onLaunchDebate={handleLaunchDebate}
                showToast={showToast}
              />
            )}

            {activePage === 'debate' && (
              <DebateRoomPage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                setActivePage={setActivePage}
                showToast={showToast}
                onIntervene={handleIntervene}
                runState={runState}
                onRetry={() => {
                  const idea = pendingIdea || currentProject?.intake;
                  if (idea && currentProject) runSynthesis(currentProject.id, idea);
                  else showToast('Re-open Idea Lab and submit again', 'alert');
                }}
              />
            )}

            {activePage === 'verdict' && (
              <VerdictPage
                currentProject={currentProject}
                setActivePage={setActivePage}
              />
            )}

            {activePage === 'blueprint' && (
              <BlueprintPage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                showToast={showToast}
                setActivePage={setActivePage}
                onSave={(brief) => updateProject(currentProject.id, {
                  blueprint: { ...(currentProject.blueprint || {}), ...brief }
                })}
              />
            )}

            {activePage === 'prototype' && (
              <PrototypePage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                showToast={showToast}
              />
            )}
          </main>

          {/* Toast Notification Container */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}
        </div>
      );
    }

    // Render the React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
