    async function readNdjson(response, onEvent) {
      if (!response.body || !response.body.getReader) {
        const text = await response.text();
        text.split("\n").filter(Boolean).forEach((line) => onEvent(JSON.parse(line)));
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut = buffer.indexOf("\n");
        while (cut >= 0) {
          const line = buffer.slice(0, cut).trim();
          buffer = buffer.slice(cut + 1);
          if (line) onEvent(JSON.parse(line));
          cut = buffer.indexOf("\n");
        }
      }
      if (buffer.trim()) onEvent(JSON.parse(buffer.trim()));
    }

      return String(value || "").replace(/\s+/g, " ").trim().slice(0, max);

    function hashString(str) {
      let h = 2166136261;
      const s = String(str || "");
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h >>> 0);
    }

    function sleepMs(ms) {

    async function callBrowserGemini(prompt, apiKey, temperature = 0.7) {
      const models = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash"];
      let lastErr = "Gemini call failed";
      for (const model of models) {
        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey.trim())}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYNA_SYSTEM_PROMPT }] },
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature,
                  maxOutputTokens: 4096,
                  responseMimeType: "application/json",
                },
              }),
            }
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            lastErr = data?.error?.message || `HTTP ${res.status}`;
            continue;
          }
          const text = (data.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("");
          const start = text.indexOf("{");
          const end = text.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("Invalid JSON from model");
          return { model, json: JSON.parse(text.slice(start, end + 1)) };
        } catch (err) {
          lastErr = err.message || "Gemini error";
        }
      }
      throw new Error(lastErr);
    }

          if (next.title.length > 2) score += 15;
          if (next.problemStatement.length > 20) score += 20;
          if (next.targetAudience.length > 10) score += 15;
          if (next.solution.length > 20) score += 15;

    // ==========================================
    // PAGE 4: DEBATE ROOM (Builder vs Challenger)
    // ==========================================
    function DebateRoomPage({ currentProject, setActivePage, showToast, onIntervene, runState, onRetry }) {
      const isLive = Boolean(currentProject?.live);
      const transcript = (currentProject?.transcript && currentProject.transcript.length)
        ? currentProject.transcript
        : (isLive ? [] : MOCK_DEBATE_TRANSCRIPT);
      const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [customCounterArg, setCustomCounterArg] = useState("");
      const [intervening, setIntervening] = useState(false);
      const injectedCounters = currentProject?.interventions || [];

      useEffect(() => {
        setCurrentRoundIndex(0);
        setIsPlaying(false);
      }, [currentProject?.id, transcript.length]);

      const activeRound = transcript[Math.min(currentRoundIndex, Math.max(transcript.length - 1, 0))];
      const liveRun = runState?.active && runState.projectId === currentProject?.id;
      const waiting = isLive && transcript.length === 0;

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setCurrentRoundIndex((prev) => {
              if (prev < transcript.length - 1) {
                return prev + 1;
              }
              setIsPlaying(false);
              return prev;
            });
          }, 4500);
        }
        return () => clearInterval(interval);
      }, [isPlaying, transcript.length]);

      const handleAddIntervention = async (e) => {
        e.preventDefault();
        if (!customCounterArg.trim() || intervening) return;
        const note = customCounterArg.trim();
        setIntervening(true);
        setCustomCounterArg("");
        try {
          await onIntervene({
            note,
            round: activeRound,
            roundIndex: currentRoundIndex
          });
          showToast("Both agents answered your pushback", "info");
        } catch (error) {
          showToast(error.message || "Intervention failed", "alert");
          setCustomCounterArg(note);
        } finally {
          setIntervening(false);
        }
      };

      if (waiting) {
        return (
          <div className="min-h-screen bg-ivory">
            <div className="max-w-3xl mx-auto px-6 md:px-10 py-24">
              <span className="font-mono text-xs uppercase tracking-widest text-subtle">Live chamber // {currentProject?.title}</span>
              <h1 className="font-display text-4xl md:text-6xl font-bold text-ink mt-3 tracking-tight">
                {runState?.error ? "The chamber stalled." : "Pressure is being applied."}
              </h1>
              <p className="font-sans text-lg text-ink/80 mt-6 max-w-xl">
                {runState?.error || runState?.message || "Opening the debate…"}
              </p>
              <div className="mt-10 grid grid-cols-1 sm:grid-cols-3 border border-ink">
                {[
                  ["01", "Debate", runState?.phase === "debate" || !runState?.phase],
                  ["02", "Verdict", runState?.phase === "verdict"],
                  ["03", "Prototype", runState?.phase === "blueprint"]
                ].map(([num, label, on]) => (
                  <div key={num} className={`p-5 border-b sm:border-b-0 sm:border-r last:border-r-0 border-ink ${on ? "bg-lime" : "bg-ivory"}`}>
                    <span className="font-mono text-xs">{num}</span>
                    <div className="font-display text-xl font-bold mt-2">{label}</div>
                  </div>
                ))}
              </div>
              {(runState?.error || !liveRun) && (
                <button onClick={onRetry} className="mt-8 bg-ink text-ivory px-6 py-3 font-mono text-xs uppercase tracking-wider">
                  {runState?.error ? "Retry synthesis →" : "Resume synthesis →"}
                </button>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-ivory pb-20">
          {/* Top Dialectic Header Strip */}
          <div className="border-b border-ink/20 bg-sand/30 py-4 px-6 md:px-10">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span className="font-mono text-[10px] uppercase tracking-widest text-subtle">
                  {currentProject?.live ? `Live synthesis${currentProject.model ? " // " + currentProject.model : ""}` : "Sample dossier // not a live run"}
                  {liveRun ? ` // ${runState.message}` : ""}
                </span>
                <h1 className="font-display text-2xl font-bold text-ink">
                  Stress-Testing: {currentProject?.title || "OmniLedger"}
                </h1>
              </div>

              {/* Round Selector Tabs */}
              <div className="flex items-center gap-1 overflow-x-auto pb-1 md:pb-0">
                {transcript.map((round, idx) => (
                  <button
                    key={idx}
                    onClick={() => setCurrentRoundIndex(idx)}
                    className={`font-mono text-xs uppercase px-3 py-1.5 border transition-all whitespace-nowrap ${
                      currentRoundIndex === idx 
                        ? 'bg-ink text-ivory border-ink font-bold' 
                        : 'bg-transparent text-subtle border-ink/20 hover:border-ink hover:text-ink'
                    }`}
                  >
                    R{idx + 1}: {round.title.split(" ")[0]}
                  </button>
                ))}
              </div>

              {/* Conclude Button */}
              <button
                onClick={() => setActivePage('verdict')}
                className="bg-ink text-ivory px-4 py-2 font-mono text-xs uppercase tracking-wider flex items-center gap-2 hover:bg-black"
              >
                <span>Generate Verdict</span>
                <span className="text-lime font-bold">↗</span>
              </button>
            </div>
          </div>

          {/* Current Round Banner */}
          <div className="max-w-7xl mx-auto px-6 md:px-10 pt-8 pb-4">
            <div className="flex items-center justify-between border-b border-ink/15 pb-4">
              <div>
                <span className="font-mono text-xs uppercase tracking-widest text-subtle">
                  ROUND 0{activeRound.round} OF 04
                </span>
                <h2 className="font-display text-3xl font-bold text-ink mt-0.5">
                  {activeRound.title}
                </h2>
              </div>

              {/* Play / Next Controls */}

                <button
                  onClick={() => setIsPlaying(!isPlaying)}

                  <span className={`w-2 h-2 ${isPlaying ? 'bg-lime animate-ping' : 'bg-ink'}`}></span>
                  {isPlaying ? 'Pause Auto-Debate' : 'Simulate Auto-Play'}

              {/* LEFT: THE BUILDER */}
              <div className="border-2 border-ink bg-ivory flex flex-col justify-between shadow-[4px_4px_0px_#111111]">
                {/* Column Head */}
                <div className="p-6 md:p-8 border-b-2 border-ink bg-[#FAF9F5]">
                  <div className="flex items-center justify-between mb-4">
                    <span className="font-mono text-xs uppercase tracking-widest text-ink font-bold">
                      Persona 01 // Thesis Advocate
                    </span>
                    <span className="bg-lime text-ink px-2.5 py-1 font-mono text-[10px] uppercase font-bold tracking-wider border border-ink">
                      Defensive Moat
                    </span>
                  </div>
                  <h3 className="font-condensed text-4xl md:text-5xl font-bold tracking-tight text-ink uppercase">
                    GROWTH HACKER
                  </h3>
                  <p className="font-mono text-xs text-subtle mt-1">
                    Finds the wedge, the offer, and the distribution trick

    // ==========================================

    function App() {
      const [activePage, setActivePage] = useState('landing');
      const [projects, setProjects] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('syna-projects-v1') || 'null');
          if (Array.isArray(saved) && saved.length) return saved;
        } catch (error) {}
        return DEFAULT_PROJECTS;
      });
      const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem('syna-selected-v1') || 'syna-01');
      const [toast, setToast] = useState(null);
      const [runState, setRunState] = useState({ active: false, projectId: null, phase: '', message: '', error: '' });
      const [pendingIdea, setPendingIdea] = useState(null);
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('syna-gemini-api-key') || '');
      const [keyModalOpen, setKeyModalOpen] = useState(false);
      const [keyDraft, setKeyDraft] = useState(() => localStorage.getItem('syna-gemini-api-key') || '');

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
      };

      const handleSaveApiKey = (e) => {
        e.preventDefault();
        const cleaned = keyDraft.trim();
        if (cleaned) {
          localStorage.setItem('syna-gemini-api-key', cleaned);
          setGeminiKey(cleaned);
          showToast('Gemini API key saved in browser localStorage', 'info');
        } else {
          localStorage.removeItem('syna-gemini-api-key');
          setGeminiKey('');
          showToast('Cleared custom key — using built-in synthesis engine', 'info');
        }
        setKeyModalOpen(false);
      };

      useEffect(() => {
        localStorage.setItem('syna-projects-v1', JSON.stringify(projects));
      }, [projects]);

      useEffect(() => {
        if (selectedProjectId) localStorage.setItem('syna-selected-v1', selectedProjectId);
      }, [selectedProjectId]);

      const currentProject = projects.find(p => p.id === selectedProjectId) || projects[0];

      const updateProject = (id, patch) => {
        setProjects((prev) => prev.map((project) => project.id === id ? { ...project, ...patch } : project));
      };

      const runClientFallback = async (projectId, formData) => {
        const synth = buildClientSynthesis(formData);
        setRunState({
          active: true,
          projectId,
          phase: 'debate',
          message: 'Growth hacker and ruthless VC are opening the debate…',
          error: ''
        });
        await sleepMs(450);
        updateProject(projectId, {
          transcript: synth.rounds,
          roundsCompleted: synth.rounds.length,
          status: 'Debate Live',
          live: true,
          model: synth.model
        });
        setRunState({
          active: true,
          projectId,
          phase: 'verdict',
          message: 'Scoring survival, kill-shots, and the two paths forward…',
          error: ''
        });
        await sleepMs(450);
        updateProject(projectId, {
          audit: synth.audit,
          score: synth.audit.score,
          verdict: synth.audit.verdict,
          keyTension: synth.audit.keyTension || formData.biggestFear,
          disagreements: synth.audit.disagreements || [],
          category: synth.audit.category || formData.stage,
          status: 'Stress-Tested'
        });
        setRunState({
          active: true,
          projectId,
          phase: 'blueprint',
          message: 'Writing the 14-day MVP and the landing prototype…',
          error: ''
        });
        await sleepMs(400);
        updateProject(projectId, {
          blueprint: synth.blueprint,
          landing: synth.landing,
          model: synth.model
        });
        setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
        showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
      };

      const runSynthesis = async (projectId, formData) => {
        setRunState({
          active: true,
          projectId,
          phase: 'debate',
          message: 'Opening the adversarial chamber…',
          error: ''
        });
        setPendingIdea(formData);

        const isLocalServer =
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === 'localhost';

        if (!isLocalServer && geminiKey) {
          try {
            setRunState({
              active: true,
              projectId,
              phase: 'debate',
              message: 'Growth hacker and ruthless VC are opening the debate (Gemini)…',
              error: ''
            });
            const ideaSummary = [
              `Title: ${clipText(formData.title, 120)}`,
              `Tagline: ${clipText(formData.tagline, 240)}`,
              `Stage: ${clipText(formData.stage, 80)}`,
              `Revenue model: ${clipText(formData.revenueModel, 160)}`,
              `Target customer: ${clipText(formData.targetAudience, 400)}`,
              `Problem: ${clipText(formData.problemStatement, 900)}`,
              `Solution: ${clipText(formData.solution, 900)}`,
              `Founder fear: ${clipText(formData.biggestFear, 400)}`
            ].join('\n');
            const fallbackBase = buildClientSynthesis(formData);
            const debateRes = await callBrowserGemini(
              `Run a 4-round adversarial debate on this startup idea.\n\n${ideaSummary}\n\nReturn JSON: {"rounds":[{"round":1,"title":"Market Wedge & Willingness to Pay","builder":{"argument":"90-130 words","lever":"4-8 words","timeToValue":"short label"},"challenger":{"argument":"90-130 words","fatalRisk":"4-8 words","salesFriction":"short label"}}]} for 4 rounds: 1. Market Wedge & Willingness to Pay, 2. Defensibility & Why This Is Not a Feature, 3. Unit Economics & Go-to-Market, 4. Existential Risk & The Bet That Saves It.`,
              geminiKey,
              0.8
            );
            const rounds = Array.isArray(debateRes.json.rounds) && debateRes.json.rounds.length >= 4
              ? debateRes.json.rounds.slice(0, 4).map((r, idx) => ({
                  round: idx + 1,
                  title: r.title || fallbackBase.rounds[idx].title,
                  builder: {
                    title: 'Growth Hacker',
                    subtitle: 'Finds the wedge',
                    argument: r.builder?.argument || fallbackBase.rounds[idx].builder.argument,
                    lever: r.builder?.lever || fallbackBase.rounds[idx].builder.lever,
                    timeToValue: r.builder?.timeToValue || fallbackBase.rounds[idx].builder.timeToValue
                  },
                  challenger: {
                    title: 'Ruthless VC',
                    subtitle: 'Tries to kill it',
                    argument: r.challenger?.argument || fallbackBase.rounds[idx].challenger.argument,
                    fatalRisk: r.challenger?.fatalRisk || fallbackBase.rounds[idx].challenger.fatalRisk,
                    salesFriction: r.challenger?.salesFriction || fallbackBase.rounds[idx].challenger.salesFriction
                  }
                }))
              : fallbackBase.rounds;
            updateProject(projectId, {
              transcript: rounds,
              roundsCompleted: rounds.length,
              status: 'Debate Live',
              live: true,
              model: debateRes.model
            });
            setRunState({
              active: true,
              projectId,
              phase: 'verdict',
              message: 'Scoring survival, kill-shots, and the two paths forward…',
              error: ''
            });
            await sleepMs(350);
            updateProject(projectId, {
              audit: fallbackBase.audit,
              score: fallbackBase.audit.score,
              verdict: fallbackBase.audit.verdict,
              keyTension: fallbackBase.audit.keyTension,
              disagreements: fallbackBase.audit.disagreements,
              category: fallbackBase.audit.category,
              status: 'Stress-Tested'
            });
            setRunState({
              active: true,
              projectId,
              phase: 'blueprint',
              message: 'Writing the 14-day MVP and the landing prototype…',
              error: ''
            });
            await sleepMs(350);
            updateProject(projectId, {
              blueprint: fallbackBase.blueprint,
              landing: fallbackBase.landing,
              model: debateRes.model
            });
            setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
            showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
            return;
          } catch (e) {
            await runClientFallback(projectId, formData);
            return;
          }
        }

        if (!isLocalServer) {
          await runClientFallback(projectId, formData);
          return;
        }

        try {
          const response = await fetch('/api/run', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(geminiKey ? { 'x-gemini-key': geminiKey } : {})
            },
            body: JSON.stringify({ ...formData, apiKey: geminiKey || undefined })
          });
          if (!response.ok) {
            throw new Error(`Chamber returned ${response.status}`);
          }
          let failed = '';
          await readNdjson(response, (event) => {
            if (event.type === 'phase') {
              setRunState((prev) => ({ ...prev, phase: event.phase, message: event.message, error: '' }));
            }
            if (event.type === 'debate') {
              updateProject(projectId, {
                transcript: event.rounds,
                roundsCompleted: event.rounds.length,
                status: 'Debate Live',
                live: true,
                model: event.model
              });
            }
            if (event.type === 'verdict') {
              updateProject(projectId, {
                audit: event.audit,
                score: event.score,
                verdict: event.verdict,
                keyTension: event.keyTension || formData.biggestFear,
                disagreements: event.disagreements || [],
                category: event.category || formData.stage,
                status: 'Stress-Tested'
              });
            }
            if (event.type === 'blueprint') {
              updateProject(projectId, {
                blueprint: event.blueprint,
                landing: event.landing,
                model: event.model || undefined
              });
            }
            if (event.type === 'error') failed = event.message || 'Synthesis failed';
          });
          if (failed) throw new Error(failed);
          setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
          showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
        } catch (error) {
          await runClientFallback(projectId, formData);
        }
      };

      const handleLaunchDebate = (formData) => {
        const id = `syna-${Date.now().toString().slice(-6)}`;
        const newProj = {
          id,
          title: formData.title,
          tagline: formData.tagline || formData.problemStatement.slice(0, 90),
          stage: formData.stage,
          status: 'In chamber',
          score: null,
          createdAt: new Date().toISOString().split('T')[0],
          category: formData.revenueModel || 'Early thesis',
          roundsCompleted: 0,
          keyTension: formData.biggestFear || 'Unresolved until the debate finishes',
          targetAudience: formData.targetAudience,
          problemStatement: formData.problemStatement,
          solution: formData.solution,
          revenueModel: formData.revenueModel,
          biggestFear: formData.biggestFear,
          live: true,
          intake: formData,
          disagreements: []
        };
        setProjects((prev) => [newProj, ...prev]);
        setSelectedProjectId(id);
        setActivePage('debate');
        showToast(`Chamber opened for "${newProj.title}"`, 'info');
        runSynthesis(id, formData);
      };

      const handleIntervene = async ({ note, round, roundIndex }) => {
        const ideaObj = currentProject.intake || currentProject;
        let data = null;
        const isLocalServer =
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === 'localhost';

        if (isLocalServer) {
          try {
            const response = await fetch('/api/intervene', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                ...(geminiKey ? { 'x-gemini-key': geminiKey } : {})
              },
              body: JSON.stringify({
                idea: ideaObj,
                note,
                round,
                transcript: currentProject.transcript || MOCK_DEBATE_TRANSCRIPT,
                apiKey: geminiKey || undefined
              })
            });
            if (response.ok) {
              data = await response.json();
            }
          } catch (e) {}
        }

        if (!data) {
          await sleepMs(300);
          data = buildClientIntervention(ideaObj, round, note);
        }

        const entry = {
          round: roundIndex + 1,
          text: note,
          timestamp: 'Just now',
          builderReply: data.builderReply,
          challengerReply: data.challengerReply,
          shift: data.shift
        };
        updateProject(currentProject.id, {
          interventions: [...(currentProject.interventions || []), entry]
        });
      };

      // Custom Cursor Implementation with Lag & Interactive Hover
      useEffect(() => {
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');

        if (!dot || !ring) return;

        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion) {
          dot.style.display = 'none';
          ring.style.display = 'none';
          document.body.classList.remove('custom-cursor-active');
          return;
        }

        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        };

        const render = () => {
          // Smooth delayed following for the ring
          ringX += (mouseX - ringX) * 0.18;
          ringY += (mouseY - ringY) * 0.18;
          ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
          requestAnimationFrame(render);
        };

        const onMouseOver = (e) => {
          const target = e.target;
          if (
            target.closest('button') || 
            target.closest('a') || 
            target.closest('input') || 
            target.closest('select') || 
            target.closest('textarea') ||
            target.closest('.interactive-target')
          ) {
            ring.classList.add('cursor-hover');
            if (target.closest('.challenger-zone')) {
              ring.classList.add('cursor-challenger');
            }
          } else {
            ring.classList.remove('cursor-hover');
            ring.classList.remove('cursor-challenger');
          }
        };

        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseover', onMouseOver);
        const animId = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseover', onMouseOver);
          cancelAnimationFrame(animId);
        };
      }, []);

      // Scroll to top on page change
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activePage]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Global Navigation */}
          <Navigation
            activePage={activePage}
            setActivePage={setActivePage}
            activeProject={currentProject}
            hasApiKey={Boolean(geminiKey)}
            onOpenKeyModal={() => {
              setKeyDraft(geminiKey);
              setKeyModalOpen(true);
            }}
          />

          {keyModalOpen && (
            <div className="fixed inset-0 z-50 bg-ink/60 flex items-center justify-center p-4">
              <div className="bg-ivory border-2 border-ink max-w-lg w-full p-6 md:p-8 shadow-[8px_8px_0_#111]">
                <div className="flex items-center justify-between border-b border-ink/20 pb-3 mb-4">
                  <span className="font-mono text-xs uppercase tracking-widest font-bold text-ink">
                    Synthesis Engine Settings
                  </span>
                  <button
                    onClick={() => setKeyModalOpen(false)}
                    className="font-mono text-xs text-subtle hover:text-ink"
                  >
                    ✕
                  </button>
                </div>
                <p className="font-sans text-sm text-ink/80 leading-relaxed mb-4">
                  SYNA works out-of-the-box for everyone using its built-in Adversarial Synthesis Engine. Optionally, you can paste a Google Gemini API key (<code className="font-mono text-xs bg-sand px-1">AIza...</code>) stored only in your browser.
                </p>
                <form onSubmit={handleSaveApiKey} className="space-y-4">
                  <div>
                    <label className="block font-mono text-[11px] uppercase tracking-wider text-subtle mb-1">
                      Optional Gemini API Key
                    </label>
                    <input
                      type="password"
                      placeholder="AIzaSy... (leave blank to use built-in engine)"
                      value={keyDraft}
                      onChange={(e) => setKeyDraft(e.target.value)}
                      className="w-full bg-transparent border-b-2 border-ink py-2 font-mono text-sm text-ink focus:outline-none"
                    />
                  </div>
                  <div className="flex items-center justify-end gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setKeyDraft('');
                        localStorage.removeItem('syna-gemini-api-key');
                        setGeminiKey('');
                        setKeyModalOpen(false);
                        showToast('Using built-in synthesis engine (no API key needed)', 'info');
                      }}
                      className="font-mono text-xs uppercase px-4 py-2 border border-ink/40 hover:border-ink"
                    >
                      Use Built-in (No Key)
                    </button>
                    <button
                      type="submit"
                      className="bg-ink text-ivory font-mono text-xs uppercase px-5 py-2 hover:bg-black"
                    >
                      Save Preference
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Dynamic Page Router */}
          <main className="flex-grow">
            {activePage === 'landing' && (
              <LandingPage
                setActivePage={setActivePage}
                setDemoProject={(id) => {
                  setSelectedProjectId(id);
                  setActivePage('debate');
                }}
              />
            )}

            {activePage === 'dashboard' && (
              <DashboardPage
                projects={projects}
                setActivePage={setActivePage}
                setSelectedProjectId={setSelectedProjectId}
                onNewProjectClick={() => setActivePage('idealab')}
              />
            )}

            {activePage === 'idealab' && (
              <IdeaLabPage
                onLaunchDebate={handleLaunchDebate}
                showToast={showToast}
              />
            )}

            {activePage === 'debate' && (
              <DebateRoomPage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                setActivePage={setActivePage}
                showToast={showToast}
                onIntervene={handleIntervene}
                runState={runState}
                onRetry={() => {
                  const idea = pendingIdea || currentProject?.intake;
                  if (idea && currentProject) runSynthesis(currentProject.id, idea);
                  else showToast('Re-open Idea Lab and submit again', 'alert');
                }}
              />
            )}

            {activePage === 'verdict' && (
              <VerdictPage
                currentProject={currentProject}
                setActivePage={setActivePage}
              />
            )}

            {activePage === 'blueprint' && (
              <BlueprintPage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                showToast={showToast}
                setActivePage={setActivePage}
                onSave={(brief) => updateProject(currentProject.id, {
                  blueprint: { ...(currentProject.blueprint || {}), ...brief }
                })}
              />
            )}

            {activePage === 'prototype' && (
              <PrototypePage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                showToast={showToast}
              />
            )}
          </main>

          {/* Toast Notification Container */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}
        </div>
      );
    }

    // Render the React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
