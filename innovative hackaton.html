    async function readNdjson(response, onEvent) {
      if (!response.body || !response.body.getReader) {
        const text = await response.text();
        text.split("\n").filter(Boolean).forEach((line) => onEvent(JSON.parse(line)));
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut = buffer.indexOf("\n");
        while (cut >= 0) {
          const line = buffer.slice(0, cut).trim();
          buffer = buffer.slice(cut + 1);
          if (line) onEvent(JSON.parse(line));
          cut = buffer.indexOf("\n");
        }
      }
      if (buffer.trim()) onEvent(JSON.parse(buffer.trim()));
    }

          if (next.title.length > 2) score += 15;

          if (next.solution.length > 20) score += 15;

      const [intervening, setIntervening] = useState(false);
      const injectedCounters = currentProject?.interventions || [];

      useEffect(() => {
        setCurrentRoundIndex(0);
        setIsPlaying(false);
      }, [currentProject?.id, transcript.length]);

      const activeRound = transcript[Math.min(currentRoundIndex, Math.max(transcript.length - 1, 0))];
      const liveRun = runState?.active && runState.projectId === currentProject?.id;
      const waiting = isLive && transcript.length === 0;

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setCurrentRoundIndex((prev) => {
              if (prev < transcript.length - 1) {
                return prev + 1;
              }
              setIsPlaying(false);
              return prev;
            });
          }, 4500);
        }
        return () => clearInterval(interval);
      }, [isPlaying, transcript.length]);

      const handleAddIntervention = async (e) => {
        e.preventDefault();
        if (!customCounterArg.trim() || intervening) return;
        const note = customCounterArg.trim();
        setIntervening(true);
        setCustomCounterArg("");
        try {
          await onIntervene({
            note,
            round: activeRound,
            roundIndex: currentRoundIndex
          });
          showToast("Both agents answered your pushback", "info");
        } catch (error) {
          showToast(error.message || "Intervention failed", "alert");
          setCustomCounterArg(note);
        } finally {
          setIntervening(false);
        }
      };

      if (waiting) {
        return (
          <div className="min-h-screen bg-ivory">
            <div className="max-w-3xl mx-auto px-6 md:px-10 py-24">
              <span className="font-mono text-xs uppercase tracking-widest text-subtle">Live chamber // {currentProject?.title}</span>

                {runState?.error || runState?.message || "Opening the debate…"}

              <div className="mt-10 grid grid-cols-1 sm:grid-cols-3 border border-ink">
                {[
                  ["01", "Debate", runState?.phase === "debate" || !runState?.phase],
                  ["02", "Verdict", runState?.phase === "verdict"],
                  ["03", "Prototype", runState?.phase === "blueprint"]

                <button onClick={onRetry} className="mt-8 bg-ink text-ivory px-6 py-3 font-mono text-xs uppercase tracking-wider">
                  {runState?.error ? "Retry synthesis →" : "Resume synthesis →"}
                </button>
              )}
            </div>
          </div>

      return (

      const handleCopyBrief = () => {

    // ==========================================

    function App() {
      const [activePage, setActivePage] = useState('landing');
      const [projects, setProjects] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('syna-projects-v1') || 'null');
          if (Array.isArray(saved) && saved.length) return saved;
        } catch (error) {}
        return DEFAULT_PROJECTS;
      });
      const [selectedProjectId, setSelectedProjectId] = useState(() => localStorage.getItem('syna-selected-v1') || 'syna-01');
      const [toast, setToast] = useState(null);
      const [runState, setRunState] = useState({ active: false, projectId: null, phase: '', message: '', error: '' });
      const [pendingIdea, setPendingIdea] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
      };

      useEffect(() => {
        localStorage.setItem('syna-projects-v1', JSON.stringify(projects));
      }, [projects]);

      useEffect(() => {
        if (selectedProjectId) localStorage.setItem('syna-selected-v1', selectedProjectId);
      }, [selectedProjectId]);

      const currentProject = projects.find(p => p.id === selectedProjectId) || projects[0];

      const updateProject = (id, patch) => {
        setProjects((prev) => prev.map((project) => project.id === id ? { ...project, ...patch } : project));
      };

      const runSynthesis = async (projectId, formData) => {
        setRunState({
          active: true,
          projectId,
          phase: 'debate',
          message: 'Contacting the free-tier chamber…',
          error: ''
        });
        setPendingIdea(formData);
        try {
          const response = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          if (!response.ok) {
            const failure = await response.json().catch(() => ({}));
            throw new Error(failure.error || `Chamber returned ${response.status}`);
          }
          let failed = '';
          await readNdjson(response, (event) => {
            if (event.type === 'phase') {
              setRunState((prev) => ({ ...prev, phase: event.phase, message: event.message, error: '' }));
            }
            if (event.type === 'debate') {
              updateProject(projectId, {
                transcript: event.rounds,
                roundsCompleted: event.rounds.length,
                status: 'Debate Live',
                live: true,
                model: event.model
              });
            }
            if (event.type === 'verdict') {
              updateProject(projectId, {
                audit: event.audit,
                score: event.score,
                verdict: event.verdict,
                keyTension: event.keyTension || formData.biggestFear,
                disagreements: event.disagreements || [],
                category: event.category || formData.stage,
                status: 'Stress-Tested'
              });
            }
            if (event.type === 'blueprint') {
              updateProject(projectId, {
                blueprint: event.blueprint,
                landing: event.landing,
                model: event.model || undefined
              });
            }
            if (event.type === 'error') failed = event.message || 'Synthesis failed';
          });
          if (failed) throw new Error(failed);
          setRunState({ active: false, projectId, phase: 'done', message: 'Chamber closed.', error: '' });
          showToast('Debate, verdict, MVP plan, and prototype are ready', 'info');
        } catch (error) {
          const message = error.message && error.message.includes('Failed to fetch')
            ? 'Start the local server with npm start, then open http://127.0.0.1:8788'
            : (error.message || 'Synthesis failed');
          setRunState({
            active: true,
            projectId,
            phase: 'debate',
            message: '',
            error: message
          });
          updateProject(projectId, { status: 'Chamber stalled' });
          showToast(message, 'alert');
        }
      };

      const handleLaunchDebate = (formData) => {
        const id = `syna-${Date.now().toString().slice(-6)}`;
        const newProj = {
          id,
          title: formData.title,
          tagline: formData.tagline || formData.problemStatement.slice(0, 90),
          stage: formData.stage,
          status: 'In chamber',
          score: null,
          createdAt: new Date().toISOString().split('T')[0],
          category: formData.revenueModel || 'Early thesis',
          roundsCompleted: 0,
          keyTension: formData.biggestFear || 'Unresolved until the debate finishes',
          targetAudience: formData.targetAudience,
          problemStatement: formData.problemStatement,
          solution: formData.solution,
          revenueModel: formData.revenueModel,
          biggestFear: formData.biggestFear,
          live: true,
          intake: formData,
          disagreements: []
        };
        setProjects((prev) => [newProj, ...prev]);
        setSelectedProjectId(id);
        setActivePage('debate');
        showToast(`Chamber opened for "${newProj.title}"`, 'info');
        runSynthesis(id, formData);
      };

      const handleIntervene = async ({ note, round, roundIndex }) => {
        const response = await fetch('/api/intervene', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idea: currentProject.intake || currentProject,
            note,
            round,
            transcript: currentProject.transcript || MOCK_DEBATE_TRANSCRIPT
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Intervention failed');
        const entry = {
          round: roundIndex + 1,
          text: note,
          timestamp: 'Just now',
          builderReply: data.builderReply,
          challengerReply: data.challengerReply,
          shift: data.shift
        };
        updateProject(currentProject.id, {
          interventions: [...(currentProject.interventions || []), entry]
        });
      };

      // Custom Cursor Implementation with Lag & Interactive Hover
      useEffect(() => {
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');

        if (!dot || !ring) return;

        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion) {
          dot.style.display = 'none';
          ring.style.display = 'none';
          document.body.classList.remove('custom-cursor-active');
          return;
        }

        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
        };

        const render = () => {
          // Smooth delayed following for the ring
          ringX += (mouseX - ringX) * 0.18;
          ringY += (mouseY - ringY) * 0.18;
          ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
          requestAnimationFrame(render);
        };

        const onMouseOver = (e) => {
          const target = e.target;
          if (
            target.closest('button') || 
            target.closest('a') || 
            target.closest('input') || 
            target.closest('select') || 
            target.closest('textarea') ||
            target.closest('.interactive-target')
          ) {
            ring.classList.add('cursor-hover');
            if (target.closest('.challenger-zone')) {
              ring.classList.add('cursor-challenger');
            }
          } else {
            ring.classList.remove('cursor-hover');
            ring.classList.remove('cursor-challenger');
          }
        };

        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseover', onMouseOver);
        const animId = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseover', onMouseOver);
          cancelAnimationFrame(animId);
        };
      }, []);

      // Scroll to top on page change
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activePage]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Global Navigation */}
          <Navigation
            activePage={activePage}
            setActivePage={setActivePage}
            activeProject={currentProject}
          />

          {/* Dynamic Page Router */}
          <main className="flex-grow">
            {activePage === 'landing' && (
              <LandingPage
                setActivePage={setActivePage}
                setDemoProject={(id) => {
                  setSelectedProjectId(id);
                  setActivePage('debate');
                }}
              />
            )}

            {activePage === 'dashboard' && (
              <DashboardPage
                projects={projects}
                setActivePage={setActivePage}
                setSelectedProjectId={setSelectedProjectId}
                onNewProjectClick={() => setActivePage('idealab')}
              />
            )}

            {activePage === 'idealab' && (
              <IdeaLabPage
                onLaunchDebate={handleLaunchDebate}
                showToast={showToast}
              />
            )}

            {activePage === 'debate' && (
              <DebateRoomPage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                setActivePage={setActivePage}
                showToast={showToast}
                onIntervene={handleIntervene}
                runState={runState}
                onRetry={() => {
                  const idea = pendingIdea || currentProject?.intake;
                  if (idea && currentProject) runSynthesis(currentProject.id, idea);
                  else showToast('Re-open Idea Lab and submit again', 'alert');
                }}
              />
            )}

            {activePage === 'verdict' && (
              <VerdictPage
                currentProject={currentProject}
                setActivePage={setActivePage}
              />
            )}

            {activePage === 'blueprint' && (
              <BlueprintPage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                showToast={showToast}
                setActivePage={setActivePage}
                onSave={(brief) => updateProject(currentProject.id, {
                  blueprint: { ...(currentProject.blueprint || {}), ...brief }
                })}
              />
            )}

            {activePage === 'prototype' && (
              <PrototypePage
                key={currentProject?.id || 'sample'}
                currentProject={currentProject}
                showToast={showToast}
              />
            )}
          </main>

          {/* Toast Notification Container */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}
        </div>
      );
    }

    // Render the React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
